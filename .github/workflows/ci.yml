name: CI
on:
  pull_request:
  push:
    branches: [main, "claude/**"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: dotnet restore Fms.sln
      - run: dotnet build Fms.sln --no-restore -c Release
      - name: Vulnerable packages
        run: |
          dotnet list Fms.sln package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          ! grep -q "has the following vulnerable packages" vuln.txt
      # Integration tests start SQL Server with Testcontainers; Docker is available on ubuntu-latest.
      - run: dotnet test Fms.sln --no-build -c Release

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  e2e:
    # Real browser, web build, API, SQL Server and a fake OpenID Connect provider. See scripts/e2e-full.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: scripts/e2e-full.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: |
            web/test-results
            /tmp/fms-e2e/*.log

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.api -t fms-api .
      - run: docker build -f Dockerfile.migrator -t fms-migrator .
      - run: docker build -f Dockerfile.worker -t fms-worker .
      - run: docker build -t fms-web web
