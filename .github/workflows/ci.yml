name: CI
on:
  pull_request:
  push:
    branches: [main, "claude/**"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: dotnet restore Fms.sln
      - run: dotnet build Fms.sln --no-restore -c Release
      - name: Vulnerable packages
        run: |
          dotnet list Fms.sln package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          ! grep -q "has the following vulnerable packages" vuln.txt
      # Unit and API tests need no database. The integration tests (SQL Server in Testcontainers) run in the parallel `integration` job below.
      - run: dotnet test tests/Fms.UnitTests --no-build -c Release
      - run: dotnet test tests/Fms.ApiTests --no-build -c Release

  integration:
    # Integration tests start SQL Server with Testcontainers; Docker is available on ubuntu-latest. The classes are dealt out
    # round-robin to the slices by scripts/integration-shard.sh, so a new test class lands in exactly one slice.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3, 4]
    name: integration (${{ matrix.slice }} of 4)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: dotnet build tests/Fms.IntegrationTests -c Release
      - run: scripts/integration-shard.sh ${{ matrix.slice }} 4 -c Release

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  e2e:
    # Real browser, web build, API, SQL Server and a fake OpenID Connect provider. See scripts/e2e-full.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: scripts/e2e-full.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: |
            web/test-results
            /tmp/fms-e2e/*.log

  onprem-rehearsal:
    # Installs the Compose bundle with the bundled SQL Server, upgrades it with the backup, enters data, rolls back, and checks the data is gone. Images are built from the real Dockerfiles.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: scripts/rehearse-onprem.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f Dockerfile.api -t fms-api .
      - run: docker build -f Dockerfile.migrator -t fms-migrator .
      - run: docker build -f Dockerfile.worker -t fms-worker .
      - run: docker build -t fms-web web
      # Scan what we ship. Fixed critical and high findings in the images (base layers and libraries) fail the build; unfixed ones are reported only.
      - name: Scan images
        run: |
          mkdir -p scan
          for image in fms-api fms-migrator fms-worker fms-web; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/scan:/out" aquasec/trivy:0.58.1 image \
              --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --no-progress --format table "$image" | tee "scan/$image.txt"
          done
      - name: Check no secrets were committed
        run: docker run --rm -v "$PWD:/repo" aquasec/trivy:0.58.1 fs --scanners secret --exit-code 1 --no-progress --skip-dirs /repo/web/node_modules /repo
      - name: Release keys are production keys (informational on branches)
        run: scripts/check-release-keys.sh || echo "::notice::Development license key still trusted; this must be replaced before a release (the release workflow enforces it)."

  packaging:
    # The chart, the Azure template and the on-premise scripts are checked on every change, so a release is never the first time they run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: Helm lint and render
        run: |
          helm lint deploy/helm/fms -f deploy/helm/fms/ci-values.yaml
          helm template fms deploy/helm/fms -f deploy/helm/fms/ci-values.yaml > rendered.yaml
          helm template fms deploy/helm/fms --set deployment.mode=SaaS --set migrator.enabled=false --set 'auth.providers[0].name=e,auth.providers[0].authority=https://l.example.com,auth.providers[0].audience=api://fms' > rendered-saas.yaml
      - name: Check rendered manifests against the Kubernetes schemas
        run: |
          docker run --rm -v "$PWD:/w" ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -kubernetes-version 1.30.0 /w/rendered.yaml /w/rendered-saas.yaml
      - name: Rendered pods are locked down
        run: |
          grep -c "readOnlyRootFilesystem: true" rendered.yaml
          ! grep -q "privileged: true" rendered.yaml
          ! grep -q "runAsUser: 0" rendered.yaml
      - name: Bicep compiles
        run: az bicep build --file deploy/azure/main.bicep --stdout > /dev/null
      - name: On-premise scripts
        run: |
          scripts/test-onprem-scripts.sh
          for f in deploy/onprem/*.sh scripts/*.sh; do bash -n "$f"; done
          docker compose -f deploy/onprem/docker-compose.yml --env-file deploy/onprem/.env.example config -q || true
      - name: Bundle builds
        run: scripts/make-onprem-bundle.sh 0.0.0-ci && tar tzf dist/fms-onprem-0.0.0-ci.tar.gz | grep -q upgrade.sh
