apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fms.fullname" . }}-worker
  labels: {{- include "fms.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: {{- include "fms.selector" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "fms.selector" (dict "root" . "component" "worker") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "fms.serviceAccount" . }}
      automountServiceAccountToken: false
      securityContext: {{- include "fms.podSecurity" . | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "fms.image" (dict "root" . "name" "worker") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- include "fms.containerSecurity" . | nindent 12 }}
          envFrom:
            - configMapRef: { name: {{ include "fms.fullname" . }}-config }
          env:
            {{- include "fms.commonEnv" . | nindent 12 }}
            - name: ConnectionStrings__Default
              valueFrom: { secretKeyRef: { name: {{ .Values.database.existingSecret }}, key: app } }
            {{- if .Values.email.existingSecret }}
            - name: Email__User
              valueFrom: { secretKeyRef: { name: {{ .Values.email.existingSecret }}, key: user } }
            - name: Email__Password
              valueFrom: { secretKeyRef: { name: {{ .Values.email.existingSecret }}, key: password } }
            {{- end }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if eq .Values.storage.provider "Local" }}
            - { name: files, mountPath: /data/files }
            {{- end }}
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 256Mi } }
        {{- if eq .Values.storage.provider "Local" }}
        - name: files
          persistentVolumeClaim: { claimName: {{ default (printf "%s-files" (include "fms.fullname" .)) .Values.storage.local.existingClaim }} }
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
