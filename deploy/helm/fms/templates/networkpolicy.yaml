{{- if .Values.networkPolicy.enabled }}
# Web accepts traffic from the ingress controller only; the API accepts traffic from the web pods only. The worker accepts none.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fms.fullname" . }}-web
  labels: {{- include "fms.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "fms.selector" (dict "root" . "component" "web") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.ingressNamespaceLabel | nindent 14 }}
      ports:
        - { port: 8080, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fms.fullname" . }}-api
  labels: {{- include "fms.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "fms.selector" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "fms.selector" (dict "root" . "component" "web") | nindent 14 }}
      ports:
        - { port: 8080, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fms.fullname" . }}-worker
  labels: {{- include "fms.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "fms.selector" (dict "root" . "component" "worker") | nindent 6 }}
  policyTypes: [Ingress]
{{- end }}
