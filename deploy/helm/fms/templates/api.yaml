apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fms.fullname" . }}-api
  labels: {{- include "fms.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {{- include "fms.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "fms.selector" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "fms.serviceAccount" . }}
      automountServiceAccountToken: false
      securityContext: {{- include "fms.podSecurity" . | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "fms.image" (dict "root" . "name" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- include "fms.containerSecurity" . | nindent 12 }}
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: {{ include "fms.fullname" . }}-config }
          env:
            {{- include "fms.commonEnv" . | nindent 12 }}
            - name: ConnectionStrings__Default
              valueFrom: { secretKeyRef: { name: {{ .Values.database.existingSecret }}, key: app } }
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
          startupProbe:
            httpGet: { path: /health/live, port: http }
            failureThreshold: 30
            periodSeconds: 5
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: license, mountPath: /etc/fms/license, readOnly: true }
            {{- if eq .Values.storage.provider "Local" }}
            - { name: files, mountPath: /data/files }
            {{- end }}
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 256Mi } }
        - name: license
          secret: { secretName: {{ .Values.license.existingSecret }}, optional: true }
        {{- if eq .Values.storage.provider "Local" }}
        - name: files
          persistentVolumeClaim: { claimName: {{ default (printf "%s-files" (include "fms.fullname" .)) .Values.storage.local.existingClaim }} }
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fms.fullname" . }}-api
  labels: {{- include "fms.labels" . | nindent 4 }}
spec:
  selector: {{- include "fms.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
